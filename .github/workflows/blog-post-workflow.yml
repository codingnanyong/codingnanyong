name: Latest blog post workflow

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://v2.velog.io/rss/@codingnanyong,https://medium.com/feed/@codingnanyong"
          feed_names: "Velog,Medium"
          max_post_count: 5
          template: "- **[$title]($url)** <sub>$feedName</sub>$newline"
